<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crie uma conta</title>
<style>
  :root{
    --bg-outer-1:#4a3fb0;
    --bg-outer-2:#2c2470;
    --panel-bg:#12102a;
    --panel-border:#1f1c3d;
    --img-border:#4f7fff;
    --img-bg:#d9d9d9;
    --text-main:#f5f3ff;
    --text-muted:#a9a3c9;
    --input-bg:#ffffff;
    --input-text:#1a1730;
    --accent:#7c5cff;
    --accent-hover:#6b4ae6;
    --link:#a78bfa;
    --error:#ff6b6b;
    --success:#4ade80;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 85%, rgba(90,70,200,.55), transparent 55%),
      linear-gradient(135deg, var(--bg-outer-1) 0%, var(--bg-outer-2) 60%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    color:var(--text-main);
  }

  .card{
    width:100%;
    max-width:820px;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:22px;
    display:flex;
    gap:28px;
    padding:28px;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
  }

  .art-panel{
    position:relative;
    flex:0 0 44%;
    border-radius:16px;
    border:1px solid var(--img-border);
    background:var(--img-bg);
    min-height:460px;
    overflow:hidden;
  }
  .art-panel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .badge{
    position:absolute;
    right:-16px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:14px;
    color:#fff;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
  }
  .badge::after{
    content:"";
    position:absolute;
    bottom:-5px;
    left:12px;
    width:0; height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:7px solid var(--accent);
  }
  .badge.top{ top:38%; }

  .form-panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }

  h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:500;
    letter-spacing:.2px;
  }
  .subtitle{
    margin:0 0 22px;
    font-size:13px;
    color:var(--text-muted);
  }
  .subtitle a{ color:var(--link); text-decoration:underline; }

  form{ display:flex; flex-direction:column; gap:12px; }

  .row{ display:flex; gap:10px; }
  .row .field{ flex:1; min-width:0; }

  .field{ position:relative; }

  input[type="text"], input[type="email"], input[type="password"]{
    width:100%;
    padding:13px 14px;
    border-radius:8px;
    border:1.5px solid transparent;
    background:var(--input-bg);
    color:var(--input-text);
    font-size:14px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{ color:#8a8494; }
  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(124,92,255,.25);
  }
  input.invalid{ border-color:var(--error); }

  .field.has-toggle input{ padding-right:42px; }
  .toggle-eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    color:#6b6478;
    display:flex;
  }
  .toggle-eye:hover{ color:#1a1730; }
  .toggle-eye svg{ width:18px; height:18px; }

  .field-error{
    font-size:11.5px;
    color:var(--error);
    min-height:14px;
    margin-top:2px;
    display:none;
  }
  .field-error.show{ display:block; }

  .inline-check{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--text-muted);
    margin-top:2px;
    user-select:none;
  }
  .inline-check input{ width:13px; height:13px; accent-color:var(--accent); cursor:pointer; }
  .inline-check a{ color:var(--link); text-decoration:underline; }

  .terms-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin-top:6px;
    font-size:13px;
    color:var(--text-muted);
  }
  .terms-row input{
    width:16px; height:16px;
    margin-top:1px;
    accent-color:var(--accent);
    cursor:pointer;
    flex-shrink:0;
  }
  .terms-row a{ color:var(--link); text-decoration:underline; }
  .terms-row label{ cursor:pointer; }

  .btn-primary{
    margin-top:14px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .05s ease;
  }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:active{ transform:scale(.99); }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:18px 0 14px;
    color:var(--text-muted);
    font-size:11.5px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#332f57;
  }

  .oauth-row{ display:flex; gap:12px; }
  .btn-oauth{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px;
    border-radius:9px;
    border:1px solid #332f57;
    background:#1a1738;
    color:var(--text-main);
    font-size:14px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn-oauth:hover{ background:#221f47; }
  .btn-oauth svg{ width:17px; height:17px; }

  .status-banner{
    display:none;
    margin-top:14px;
    padding:12px 14px;
    border-radius:8px;
    font-size:13px;
    line-height:1.4;
  }
  .status-banner.show{ display:block; }
  .status-banner.success{ background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.4); color:var(--success); }

  .success-screen{
    display:none;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }
  .success-screen.show{ display:flex; }
  .success-screen .check{
    width:52px; height:52px;
    border-radius:50%;
    background:rgba(74,222,128,.15);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:6px;
  }
  .success-screen h2{ margin:0; font-size:22px; font-weight:500; }
  .success-screen p{ margin:0; color:var(--text-muted); font-size:13.5px; line-height:1.5; }
  .success-screen .summary{
    margin-top:6px;
    width:100%;
    background:#181633;
    border:1px solid #2a2650;
    border-radius:10px;
    padding:14px 16px;
    font-size:13px;
  }
  .success-screen .summary div{ display:flex; justify-content:space-between; padding:4px 0; color:var(--text-muted); }
  .success-screen .summary div span:last-child{ color:var(--text-main); font-weight:500; }
  .btn-secondary{
    margin-top:12px;
    padding:11px 18px;
    border-radius:9px;
    border:1px solid #332f57;
    background:transparent;
    color:var(--text-main);
    font-size:13.5px;
    cursor:pointer;
  }
  .btn-secondary:hover{ background:#1a1738; }

  @media (max-width:680px){
    .card{ flex-direction:column; padding:20px; }
    .art-panel{ min-height:180px; flex:none; }
    .badge{ display:none; }
    .row{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="art-panel">
    <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=800&q=80" alt="Ilustração de boas-vindas">
    <div class="badge top">M</div>
  </div>

  <div class="form-panel">

    <div id="formView">
      <h1>Crie uma conta</h1>
      <p class="subtitle">Já tem uma conta? <a href="#" id="loginLink">Log in</a></p>

      <form id="signupForm" novalidate>
        <div class="row">
          <div class="field">
            <input type="text" id="nome" placeholder="Nome" autocomplete="name">
            <div class="field-error" id="err-nome">Informe seu nome.</div>
          </div>
          <div class="field">
            <input type="text" id="cnpj" placeholder="CNPJ" autocomplete="off">
            <div class="inline-check">
              <input type="checkbox" id="naoEmpresa">
              <label for="naoEmpresa">Não sou uma <a href="#" id="empresaInfo">empresa</a></label>
            </div>
            <div class="field-error" id="err-cnpj">Informe um CNPJ válido (14 dígitos).</div>
          </div>
        </div>

        <div class="field">
          <input type="email" id="email" placeholder="Email" autocomplete="email">
          <div class="field-error" id="err-email">Informe um email válido.</div>
        </div>

        <div class="field has-toggle">
          <input type="password" id="senha" placeholder="Senha" autocomplete="new-password">
          <button type="button" class="toggle-eye" id="toggleSenha" aria-label="Mostrar senha">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <div class="field-error" id="err-senha">Mínimo de 8 caracteres.</div>
        </div>

        <div class="terms-row">
          <input type="checkbox" id="termos">
          <label for="termos">Eu aceito os <a href="#" id="termosLink">termos de uso</a></label>
        </div>
        <div class="field-error" id="err-termos" style="margin-top:-6px;">Você precisa aceitar os termos.</div>

        <button type="submit" class="btn-primary" id="submitBtn">Criar conta</button>

        <div class="status-banner" id="statusBanner"></div>
      </form>

      <div class="divider">ou registre-se com</div>

      <div class="oauth-row">
        <button type="button" class="btn-oauth" id="googleBtn">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.7 34.9 27 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.6C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Google
        </button>
        <button type="button" class="btn-oauth" id="appleBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.462 2.106-1.232 2.87-.83.828-2.087 1.462-3.172 1.375-.13-1.096.462-2.24 1.19-2.964.83-.83 2.13-1.42 3.214-1.28zM20.617 17.41c-.552 1.28-1.213 2.542-2.196 3.628-.94 1.03-1.977 2.04-3.32 2.06-1.32.02-1.747-.79-3.253-.79-1.507 0-1.98.77-3.228.81-1.31.04-2.31-1.116-3.26-2.14-2-2.14-3.532-6.05-1.48-8.68 1.02-1.3 2.83-2.13 4.79-2.16 1.28-.02 2.48.83 3.26.83.77 0 2.23-1.03 3.76-.88.64.03 2.44.26 3.6 1.94-.09.06-2.15 1.25-2.13 3.72.02 2.95 2.6 3.93 2.63 3.95l-.16.71z"/></svg>
          Apple
        </button>
      </div>
    </div>

    <div class="success-screen" id="successScreen">
      <div class="check">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>Conta criada!</h2>
      <p>Sua conta foi criada com sucesso. Confira os dados abaixo.</p>
      <div class="summary" id="summaryBox"></div>
      <button class="btn-secondary" id="backBtn">Criar outra conta</button>
    </div>

  </div>
</div>

<script>
(function(){
  const form = document.getElementById('signupForm');
  const nome = document.getElementById('nome');
  const cnpj = document.getElementById('cnpj');
  const naoEmpresa = document.getElementById('naoEmpresa');
  const email = document.getElementById('email');
  const senha = document.getElementById('senha');
  const termos = document.getElementById('termos');
  const toggleSenha = document.getElementById('toggleSenha');
  const eyeIcon = document.getElementById('eyeIcon');
  const statusBanner = document.getElementById('statusBanner');
  const formView = document.getElementById('formView');
  const successScreen = document.getElementById('successScreen');
  const summaryBox = document.getElementById('summaryBox');
  const backBtn = document.getElementById('backBtn');

  // Toggle "não sou empresa" disables/blanks CNPJ field
  naoEmpresa.addEventListener('change', () => {
    if(naoEmpresa.checked){
      cnpj.value = '';
      cnpj.disabled = true;
      cnpj.placeholder = 'CNPJ (não aplicável)';
      clearError('cnpj');
    } else {
      cnpj.disabled = false;
      cnpj.placeholder = 'CNPJ';
    }
  });

  // Show/hide password
  const eyeOpen = eyeIcon.innerHTML;
  const eyeClosed = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.61 3.79M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  toggleSenha.addEventListener('click', () => {
    const showing = senha.type === 'text';
    senha.type = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing ? eyeOpen : eyeClosed;
    toggleSenha.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
  });

  // Mask CNPJ as user types: 00.000.000/0000-00
  cnpj.addEventListener('input', () => {
    let v = cnpj.value.replace(/\D/g, '').slice(0, 14);
    v = v.replace(/^(\d{2})(\d)/, '$1.$2');
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
    v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
    v = v.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
    cnpj.value = v;
  });

  function setError(field, show){
    const input = document.getElementById(field);
    const err = document.getElementById('err-' + field);
    if(input) input.classList.toggle('invalid', show);
    if(err) err.classList.toggle('show', show);
  }
  function clearError(field){ setError(field, false); }

  function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function validCNPJDigits(v){ return v.replace(/\D/g,'').length === 14; }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    statusBanner.classList.remove('show');

    let valid = true;

    if(!nome.value.trim()){ setError('nome', true); valid = false; } else clearError('nome');

    if(!naoEmpresa.checked){
      if(!validCNPJDigits(cnpj.value)){ setError('cnpj', true); valid = false; } else clearError('cnpj');
    } else {
      clearError('cnpj');
    }

    if(!validEmail(email.value)){ setError('email', true); valid = false; } else clearError('email');

    if(senha.value.length < 8){ setError('senha', true); valid = false; } else clearError('senha');

    if(!termos.checked){ setError('termos', true); valid = false; } else clearError('termos');

    if(!valid) return;

    // Simulate account creation
    const tipo = naoEmpresa.checked ? 'Pessoa física' : 'Empresa';
    summaryBox.innerHTML = `
      <div><span>Nome</span><span>${escapeHtml(nome.value)}</span></div>
      <div><span>Tipo de conta</span><span>${tipo}</span></div>
      ${!naoEmpresa.checked ? `<div><span>CNPJ</span><span>${escapeHtml(cnpj.value)}</span></div>` : ''}
      <div><span>Email</span><span>${escapeHtml(email.value)}</span></div>
    `;
    formView.style.display = 'none';
    successScreen.classList.add('show');
  });

  backBtn.addEventListener('click', () => {
    form.reset();
    cnpj.disabled = false;
    cnpj.placeholder = 'CNPJ';
    ['nome','cnpj','email','senha','termos'].forEach(clearError);
    successScreen.classList.remove('show');
    formView.style.display = 'block';
  });

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById('loginLink').addEventListener('click', (e) => e.preventDefault());
  document.getElementById('termosLink').addEventListener('click', (e) => e.preventDefault());
  document.getElementById('empresaInfo').addEventListener('click', (e) => e.preventDefault());
  document.getElementById('googleBtn').addEventListener('click', () => {
    statusBanner.textContent = 'Cadastro com Google ainda não configurado nesta demo.';
    statusBanner.classList.add('show');
  });
  document.getElementById('appleBtn').addEventListener('click', () => {
    statusBanner.textContent = 'Cadastro com Apple ainda não configurado nesta demo.';
    statusBanner.classList.add('show');
  });
})();
</script>

</body>
</html>
